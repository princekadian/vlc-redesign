name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - redesign

jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Full history: extras/ci/get-contrib-sha.sh looks up the last commit touching contrib
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Build in the VideoLAN win64 image
        run: |
          IMAGE=$(grep -oP 'VLC_WIN64_IMAGE: \K\S+' extras/ci/gitlab-ci.yml)
          echo "Using $IMAGE"
          set -o pipefail
          docker run --rm -u root -v "$GITHUB_WORKSPACE:/build" -w /build "$IMAGE" bash -c '
            set -ex
            git config --global --add safe.directory /build
            SHA=$(extras/ci/get-contrib-sha.sh win64)
            export VLC_PREBUILT_CONTRIBS_URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${SHA}.tar.zst"
            FLAGS=""
            if extras/ci/check-url.sh "$VLC_PREBUILT_CONTRIBS_URL"; then
              FLAGS="-p"
            else
              echo "No prebuilt contribs for $SHA, building them (slow)"
              unset VLC_PREBUILT_CONTRIBS_URL
            fi
            extras/package/win32/build.sh -a x86_64 -i n $FLAGS
            chmod -R a+rX win64
          ' 2>&1 | tee build.log

      # Logs need a GitHub login, the run summary does not: surface the compile errors there
      - name: Report build errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E -B2 -A6 'error:|Error [0-9]+|\*\*\* |undefined reference' build.log | head -n 200 || tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # annotations are capped at 10: keep the last real errors, libtool path warnings are noise
          grep -E 'error:|\*\*\* |Error [0-9]+|undefined reference' build.log | grep -v -E 'libtool: error|curl: \(22\)' \
            | tail -n 10 | while read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-win64
          path: |
            win64/vlc-*.exe
            win64/vlc-*.zip
            !win64/vlc-*-debug*
          if-no-files-found: error
